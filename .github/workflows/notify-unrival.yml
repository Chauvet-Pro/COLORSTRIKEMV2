# Managed by Chauvet-Pro/UNRIVAL — tells that repo to refresh fixtures.json
# when this repo publishes a release. Needs org secret UNRIVAL_DISPATCH_TOKEN.
name: Notify UNRIVAL

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Chauvet-Pro/UNRIVAL/dispatches \
            -d '{"event_type":"firmware-release","client_payload":{"repo":"${{ github.repository }}","tag":"${{ github.event.release.tag_name }}"}}'
        env:
          TOKEN: ${{ secrets.UNRIVAL_DISPATCH_TOKEN }}
